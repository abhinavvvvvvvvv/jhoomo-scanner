<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jhoomo Re 2026 Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f2f5f9;color:#14233a;font-family:Arial,sans-serif}
main{max-width:560px;margin:auto;background:white;padding:18px;border-radius:16px;box-shadow:0 3px 18px #0001}
h1{margin:0 0 4px;color:#0f2a4d;font-size:24px}
p{color:#526174;line-height:1.4}
button{width:100%;padding:15px;border:0;border-radius:11px;background:#0f2a4d;color:white;font-size:16px;font-weight:bold;margin:8px 0}
#reader{width:100%;margin:12px 0}
#result{padding:18px 12px;border-radius:12px;font-weight:800;font-size:19px;text-align:center;overflow-wrap:anywhere}
.WAIT{background:#e8edf4;color:#26384f}
.VALID{background:#d9f8e4;color:#11652d}
.USED,.INVALID,.ERROR{background:#ffe1e1;color:#a21d1d}
small{color:#526174}
</style>
</head>
<body>
<main>
<h1>Jhoomo Re 2026</h1>
<p>Offline ticket entry scanner</p>
<div id="result" class="WAIT">Tap Start Scanner to begin.</div>
<div id="reader"></div>
<button id="start">Start Scanner</button>
<button id="next" style="display:none;background:#e8edf4;color:#14233a">Scan Next Ticket</button>
<p><small>Internet required. Admit only when the server confirms VALID. If verification fails, do not admit.</small></p>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx5er_WtZNOlAj9Y1tbNTQebbuMGYBfZmWG3oMz9O-bR-xUAOcKjNZEun-wXYJXwv3t/exec';

let qr = null;
let busy = false;
let running = false;

const result = document.getElementById('result');
const start = document.getElementById('start');
const next = document.getElementById('next');

function show(status, message, detail = '') {
  result.className = status;
  result.textContent = message + (detail ? ' — ' + detail : '');
}

function verify(token) {
  return new Promise((resolve, reject) => {
    const callback = 'ticketCb' + Date.now() +
      Math.floor(Math.random() * 100000);

    const script = document.createElement('script');
    let finished = false;

    function cleanup() {
      if (finished) return;
      finished = true;
      clearTimeout(timeout);
      try { delete window[callback]; } catch (e) {}
      script.remove();
    }

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('No response. Check API access and deployment.'));
    }, 20000);

    window[callback] = data => {
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error('Server request failed. Check web app access.'));
    };

    script.src = API_URL +
      '?action=verify&token=' + encodeURIComponent(token) +
      '&callback=' + callback;

    document.body.appendChild(script);
  });
}

async function stopScanner() {
  if (qr && running) {
    try { await qr.stop(); } catch (e) {}
    try { await qr.clear(); } catch (e) {}
  }
  running = false;
  busy = false;
}

async function begin() {
  await stopScanner();
  next.style.display = 'none';

  if (!window.isSecureContext) {
    show('ERROR', 'HTTPS REQUIRED', 'Open the GitHub Pages HTTPS link.');
    return;
  }

  if (!window.Html5Qrcode) {
    show('ERROR', 'SCANNER LIBRARY FAILED', 'Check internet and reload.');
    return;
  }

  show('WAIT', 'Starting camera', 'Allow camera access if prompted.');
  qr = new Html5Qrcode('reader');

  try {
    await qr.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: (w, h) => {
          const n = Math.floor(Math.min(w, h) * 0.78);
          return { width: n, height: n };
        }
      },
      async text => {
        if (busy) return;
        busy = true;

        try { await qr.pause(true); } catch (e) {}

        show('WAIT', 'Verifying ticket', 'Please wait.');

        try {
          const response = await verify(text);
          const status = response.status || 'ERROR';
          const detail = [
            response.ticketId || '',
            response.type || '',
            response.scannedAt || '',
            response.detail || ''
          ].filter(Boolean).join(' • ');

          show(status, response.message || 'No server response', detail);
        } catch (e) {
          show('ERROR', 'VERIFICATION FAILED — DO NOT ADMIT', e.message);
        }

        next.style.display = 'block';
      },
      () => {}
    );

    running = true;
    show('WAIT', 'Camera ready', 'Scan one ticket QR.');
  } catch (e) {
    show('ERROR', 'CAMERA COULD NOT START',
      String(e.message || e));
  }
}

start.onclick = begin;
next.onclick = begin;
</script>
</body>
</html>
